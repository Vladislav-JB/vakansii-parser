name: kwork

on:
  workflow_dispatch: {}
  schedule:
    # 03:00–05:59 UTC = 06:00–08:59 МСК: Supabase dispatch_watchers()
    # стартует в 09:00 МСК, этим окном закрываются утренние часы (решение 28.11.2026)
    - cron: "*/4 3-5 * * *"

concurrency:
  group: kwork
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python kwork_watch.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
